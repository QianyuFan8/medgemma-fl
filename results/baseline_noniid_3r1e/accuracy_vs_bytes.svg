<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">RNA-seq FL accuracy vs bytes per round</title>
  <desc id="desc">Log-scale communication study for LoRA ranks and QLoRA.</desc>
  <rect width="100%" height="100%" fill="#FFFDF8"/>
  <text x="32" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933">TARGET RNA-seq FL: accuracy vs bytes / round</text>
  <rect x="90" y="48" width="790" height="442" fill="#FFFFFF" stroke="#D8DEE9"/>
  <text x="485.0" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#243B53">bytes / round (log scale)</text>
  <text x="22" y="269.0" transform="rotate(-90,22,269.0)" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#243B53">Accuracy</text>
  <line x1="331.5" y1="48" x2="331.5" y2="490" stroke="#EEF2F7"/>
  <text x="331.5" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#486581">954 MB</text>
  <line x1="625.3" y1="48" x2="625.3" y2="490" stroke="#EEF2F7"/>
  <text x="625.3" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#486581">9.31 GB</text>
  <line x1="90" y1="490.0" x2="880" y2="490.0" stroke="#EEF2F7"/>
  <text x="80" y="490.0" text-anchor="end" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#486581">0.00</text>
  <line x1="90" y1="379.5" x2="880" y2="379.5" stroke="#EEF2F7"/>
  <text x="80" y="379.5" text-anchor="end" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#486581">0.25</text>
  <line x1="90" y1="269.0" x2="880" y2="269.0" stroke="#EEF2F7"/>
  <text x="80" y="269.0" text-anchor="end" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#486581">0.50</text>
  <line x1="90" y1="158.5" x2="880" y2="158.5" stroke="#EEF2F7"/>
  <text x="80" y="158.5" text-anchor="end" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#486581">0.75</text>
  <line x1="90" y1="48.0" x2="880" y2="48.0" stroke="#EEF2F7"/>
  <text x="80" y="48.0" text-anchor="end" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#486581">1.00</text>
  <line x1="825.5" y1="48" x2="825.5" y2="490" stroke="#9AA5B1" stroke-dasharray="6 4"/>
  <text x="825.5" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8292A2">Full FT (theoretical 44.7 GB)</text>
  <circle cx="144.5" cy="297.1" r="6" fill="#2E86AB" />
  <text x="154.5" y="289.1" font-family="Arial, sans-serif" font-size="12" fill="#102A43">lora-r4 (0.436)</text>
  <circle cx="232.9" cy="297.1" r="6" fill="#D1495B" />
  <text x="242.9" y="289.1" font-family="Arial, sans-serif" font-size="12" fill="#102A43">lora-r8 (0.436)</text>
  <circle cx="321.4" cy="297.1" r="6" fill="#5DA271" />
  <text x="331.4" y="289.1" font-family="Arial, sans-serif" font-size="12" fill="#102A43">lora-r16 (0.436)</text>
  <circle cx="409.9" cy="297.1" r="6" fill="#EDA65D" />
  <text x="419.9" y="289.1" font-family="Arial, sans-serif" font-size="12" fill="#102A43">lora-r32 (0.436)</text>
  <circle cx="232.9" cy="262.3" r="6" fill="#8E6C8A" />
  <text x="242.9" y="254.3" font-family="Arial, sans-serif" font-size="12" fill="#102A43">qlora-r16 (0.515)</text>
  <text x="32" y="548" font-family="Arial, sans-serif" font-size="11" fill="#8292A2">Source: NVFlare LoRA-only adapter exchange on TARGET RNA-seq diagnosis classification. QLoRA uses 4-bit local training at rank 16.</text>
</svg>
